name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor supported by package.json's engines field, and the
        # runtime the Dockerfile actually ships.
        node-version: ['20', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Syntax check
        run: npm run check
      
      - name: Lint
        run: npm run lint

      - name: Static analysis
        run: npm run sast

      - name: Test
        run: npm test
        if: matrix.node-version != '20'

      # Node 20 predates --test-coverage-lines, so the floor leg runs the
      # same suite without the coverage gate around it.
      - name: Test
        run: npm run test:plain
        if: matrix.node-version == '20'

      # npm test rewrites .github/coverage.svg. A change that moves coverage
      # and leaves the badge behind is a badge that lies, so fail here rather
      # than let the README quote a figure nothing measures any more.
      - name: Coverage badge is current
        run: git diff --exit-code -- .github/coverage.svg
        if: matrix.node-version != '20'

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Coverage-guided fuzzing
        run: npm run fuzz
