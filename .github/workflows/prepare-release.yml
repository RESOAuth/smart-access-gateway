name: Prepare release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag matching the version on main (for example v0.3.0)'
        required: true
        type: string

concurrency:
  group: prepare-release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag }}
  GH_TOKEN: ${{ github.token }}

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - uses: ./.github/actions/release-tools
      - name: Validate source, version, changelog, and main checks before creating a tag
        run: node tools/release/workflow.js prepare-check

  prepare:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - uses: ./.github/actions/release-tools
      - name: Create the immutable version tag and dispatch Signed release at that tag
        run: node tools/release/workflow.js prepare
