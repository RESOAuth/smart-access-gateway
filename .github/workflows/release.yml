name: Signed release

on:
  workflow_dispatch:

# Keep this workflow path stable: it is part of the public signing identity.
# Every checkout uses the immutable event SHA, never a revision from job
# output. Validation requires the release tag to resolve to that same SHA.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_name }}
  IMAGE: ghcr.io/resoauth/sag

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
      checkpoint: ${{ steps.tag.outputs.checkpoint }}
      published: ${{ steps.tag.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: ./.github/actions/release-tools
      - name: Validate tag, source, versions, changelog, and main checks
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/release/workflow.js validate

  checks:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Static analysis
        run: npm run sast
      - name: Coverage-guided fuzzing
        run: npm run fuzz:release
      - name: Test
        run: npm test

  sign:
    needs: [validate, checks]
    if: needs.validate.outputs.published != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    env:
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: ./.github/actions/release-tools
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Restore this run's completed signing checkpoint
        if: needs.validate.outputs.checkpoint != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.validate.outputs.checkpoint }}
          merge-multiple: true
          path: release-assets
      - name: Find this run's candidate without rebuilding it
        if: needs.validate.outputs.checkpoint == ''
        id: candidate
        run: node tools/release/workflow.js candidate
      - name: Build and push candidate
        if: needs.validate.outputs.checkpoint == '' && steps.candidate.outputs.digest == ''
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.candidate.outputs.reference }}
          labels: |
            org.opencontainers.image.source=https://github.com/RESOAuth/smart-access-gateway
            org.opencontainers.image.revision=${{ needs.validate.outputs.commit }}
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
      - name: Archive tagged source and write manifest
        if: needs.validate.outputs.checkpoint == ''
        env:
          IMAGE_DIGEST: ${{ steps.candidate.outputs.digest || steps.build.outputs.digest }}
        run: node tools/release/workflow.js manifest
      - name: Sign image digest and exact manifest bytes
        if: needs.validate.outputs.checkpoint == ''
        env:
          IMAGE_DIGEST: ${{ steps.candidate.outputs.digest || steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${IMAGE_DIGEST}"
          cosign sign-blob --yes --bundle release-assets/release-manifest.sigstore.json release-assets/release-manifest.json
      - name: Attest container
        if: needs.validate.outputs.checkpoint == ''
        id: container
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/resoauth/sag
          subject-digest: ${{ steps.candidate.outputs.digest || steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest release files
        if: needs.validate.outputs.checkpoint == ''
        id: files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/sag-${{ github.ref_name }}-source.tar.gz
            release-assets/release-manifest.json
      - name: Preserve bundles and export signed envelopes
        if: needs.validate.outputs.checkpoint == ''
        env:
          FILES_BUNDLE: ${{ steps.files.outputs.bundle-path }}
          CONTAINER_BUNDLE: ${{ steps.container.outputs.bundle-path }}
        run: |
          cp "$FILES_BUNDLE" release-assets/files.provenance.sigstore.json
          cp "$CONTAINER_BUNDLE" release-assets/container.provenance.sigstore.json
          node tools/release/workflow.js export
      - name: Verify signing checkpoint
        run: node tools/release/verify.js release-assets "$RELEASE_TAG" "$RELEASE_COMMIT" "$GITHUB_RUN_ID"
      - name: Save completed signing checkpoint before any release upload
        if: needs.validate.outputs.checkpoint == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release
          path: |
            release-assets/sag-${{ github.ref_name }}-source.tar.gz
            release-assets/release-manifest.json
            release-assets/release-manifest.sigstore.json
            release-assets/files.provenance.sigstore.json
            release-assets/container.provenance.sigstore.json
            release-assets/release.intoto.jsonl
          if-no-files-found: error
          retention-days: 90

  verify:
    needs: [validate, sign]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: ./.github/actions/release-tools
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release
          path: release-assets
      - name: Verify downloaded candidate and registry content on a fresh runner
        run: node tools/release/verify.js release-assets "$RELEASE_TAG" "$RELEASE_COMMIT" "$GITHUB_RUN_ID"

  publish:
    needs: [validate, verify]
    runs-on: ubuntu-24.04
    # Serialise moving aliases across versions as well as serialising each tag.
    concurrency:
      group: release-promotion
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: ./.github/actions/release-tools
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release
          path: release-assets
      - name: Verify, upload missing draft assets, download, and verify again
        run: node tools/release/workflow.js stage
      - name: Promote the verified digest and publish last
        run: node tools/release/workflow.js publish

  verify-published:
    needs: [validate, checks]
    if: needs.validate.outputs.published == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: ./.github/actions/release-tools
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify the existing release without changing it
        run: node tools/release/workflow.js published
