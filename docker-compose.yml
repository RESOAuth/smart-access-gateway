# One command, one instance:
#
#   docker compose up          # or: podman-compose up -d
#
# That is the whole setup. Everything SAG needs is in ./data, and everything
# you might want to change is a file you can open:
#
#   ./config.env          settings, as KEY=value lines
#   ./data/clients/       one JSON file per relying party
#   ./data/sag.env        the master secret and signing key, generated on
#                         first start and never rewritten
#
# Codes are printed to the log until a real mail sender is configured:
#
#   docker compose logs -f sag

services:
  sag:
    build: .
    image: sag:local
    container_name: sag
    restart: unless-stopped
    ports:
      - '${SAG_PORT:-8787}:8787'
    # Read on the host by compose itself, so nothing has to be mounted for it.
    env_file:
      - ./config.env
    # A bind mount, so the key material and the relying party records are
    # ordinary files you can read, edit and back up. The container works out
    # who owns this directory and runs as them, which is what makes the same
    # file work under Docker and under rootless Podman - see
    # docker/entrypoint.sh and docs/docker.md.
    volumes:
      - ./data:/data
    # Both are already set in the image. They are repeated here because a
    # server listening on 127.0.0.1 inside a container is reachable from
    # nowhere, and a published port in front of it hangs rather than refusing,
    # which is a miserable thing to debug.
    environment:
      HOST: 0.0.0.0
      PORT: 8787
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
